# cargo-about: third-party notices for the crates linked into libhwbp_core.so.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# hwbp-core itself (publish = false) is EUPL-1.2 and not a third party.
private = { ignore = true }
